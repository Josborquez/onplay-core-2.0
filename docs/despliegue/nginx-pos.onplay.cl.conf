# Nginx delante de onplay-core (un solo proceso Node en :3010 sirve API y web, mismo origen).
# Copiar a /etc/nginx/sites-available/pos.onplay.cl y enlazar en sites-enabled.
# HTTPS lo agrega certbot (`certbot --nginx -d pos.onplay.cl`): reescribe este archivo con el
# bloque 443 y el redirect desde 80. La cookie de sesión es `secure` en producción, así que sin
# HTTPS nadie puede entrar.

server {
    listen 80;
    listen [::]:80;
    server_name pos.onplay.cl;

    # Cuerpos chicos: la API recibe JSON de ventas y recuentos; no hay subida de archivos.
    client_max_body_size 2m;

    # Los estáticos de la PWA ya salen con gzip desde Fastify (@fastify/compress).
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # la importación completa de un canal puede tardar más de un minuto
    }

    # Sin caché en la API: las respuestas llevan el estado del turno y del stock.
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    access_log /var/log/nginx/pos.onplay.cl.access.log;
    error_log  /var/log/nginx/pos.onplay.cl.error.log;
}
